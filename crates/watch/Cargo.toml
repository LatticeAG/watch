[package]
name = "lattice-watch"
description = "Watch — deterministic sidecar monitors, drift detection, and audit math for guarded agent runs (LatticeAGI)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "watch"
path = "src/lib.rs"

[[bin]]
name = "watchd"
path = "src/bin/watchd.rs"

[[bin]]
name = "watchctl"
path = "src/bin/watchctl.rs"

[[bin]]
name = "watch-harness"
path = "src/bin/watch-harness.rs"

[dependencies]
sha2 = "0.10"
ed25519-dalek = "2"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
base64 = "0.22"
rand = "0.8"
chacha20poly1305 = "0.10"
libc = "0.2"

[dev-dependencies]
